<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RCM & Health Index Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between shadow-xl z-20">
        <div>
            <!-- Logo Header -->
            <div class="p-5 bg-slate-950 flex items-center space-x-3 border-b border-slate-800">
                <div class="bg-blue-600 text-white p-2 rounded-lg font-bold text-lg"><i class="fa-solid fa-bolt"></i></div>
                <div>
                    <h1 class="text-white font-bold text-base leading-tight">RCM & HI</h1>
                    <p class="text-xs text-slate-400">Transformer System</p>
                </div>
            </div>

            <!-- Navigation Links -->
            <nav class="p-3 space-y-1 text-sm font-medium" id="sidebar-nav">
                <a href="#" onclick="switchMenu('home', this)" class="menu-item flex items-center space-x-3 px-3 py-2.5 rounded-lg bg-blue-600 text-white transition">
                    <i class="fa-solid fa-house w-5 text-center"></i><span>หน้าหลัก</span>
                </a>
                <a href="#" onclick="switchMenu('machines', this)" class="menu-item flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-server w-5 text-center"></i><span>ข้อมูลเครื่องจักร</span>
                </a>
                <a href="#" onclick="switchMenu('rcm', this)" class="menu-item flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-diagram-project w-5 text-center"></i><span>RCM Analysis</span>
                </a>
                <a href="#" onclick="switchMenu('fmea', this)" class="menu-item flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-clipboard-list w-5 text-center"></i><span>FMEA</span>
                </a>
                <a href="#" onclick="switchMenu('hi', this)" class="menu-item flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-heart-pulse w-5 text-center"></i><span>Health Index (HI)</span>
                </a>
                <a href="#" onclick="switchMenu('strategy', this)" class="menu-item flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-shield-halved w-5 text-center"></i><span>กลยุทธ์การบำรุงรักษา</span>
                </a>
                <a href="#" onclick="switchMenu('maintenance', this)" class="menu-item flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-calendar-days w-5 text-center"></i><span>แผนงานบำรุงรักษา</span>
                </a>
                <a href="#" onclick="switchMenu('tracking', this)" class="menu-item flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-chart-line w-5 text-center"></i><span>ติดตามผล</span>
                </a>
                <a href="#" onclick="switchMenu('reports', this)" class="menu-item flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-file-excel w-5 text-center"></i><span>รายงาน</span>
                </a>
                <a href="#" onclick="switchMenu('settings', this)" class="menu-item flex items-center space-x-3 px-3 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white transition">
                    <i class="fa-solid fa-gear w-5 text-center"></i><span>ตั้งค่า</span>
                </a>
            </nav>
        </div>

        <!-- Sidebar Footer -->
        <div class="p-4 bg-slate-950 border-t border-slate-800 text-xs">
            <p class="font-semibold text-slate-200">POWER PEOPLE</p>
            <p class="text-slate-400">BETTER CITY</p>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col h-screen overflow-hidden">
        
        <!-- Top Navbar -->
        <header class="bg-white border-b border-slate-200 px-6 py-3 flex justify-between items-center z-10 shadow-sm">
            <div>
                <h2 id="header-title" class="text-lg font-bold text-slate-800">RCM & Health Index</h2>
                <p id="header-subtitle" class="text-xs text-slate-500">Reliability-Centered Maintenance for Transformer Assets</p>
            </div>
            
            <div class="flex items-center space-x-4">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400"><i class="fa-solid fa-search"></i></span>
                    <input type="text" id="globalSearch" placeholder="ค้นหาเครื่องจักร / รหัสอุปกรณ์..." class="pl-9 pr-4 py-1.5 text-sm bg-slate-100 border border-slate-200 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 w-64" onkeyup="filterTable(this.value)">
                </div>

                <button onclick="openNotificationModal()" class="relative p-2 text-slate-600 hover:bg-slate-100 rounded-full transition">
                    <i class="fa-regular fa-bell text-lg"></i>
                    <span class="absolute top-1 right-1 bg-red-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">4</span>
                </button>

                <div class="flex items-center space-x-3 pl-3 border-l border-slate-200 cursor-pointer" onclick="openProfileModal()">
                    <div class="w-9 h-9 bg-blue-600 text-white rounded-full flex items-center justify-center font-bold text-sm">PP</div>
                    <div class="text-left hidden sm:block">
                        <p class="text-xs font-bold text-slate-800">Panissara P.</p>
                        <p class="text-[10px] text-slate-500">IE Intern</p>
                    </div>
                </div>
            </div>
        </header>

        <!-- Dynamic Content Area -->
        <main id="dynamic-container" class="flex-1 overflow-y-auto p-6 space-y-6">
            <!-- เนื้อหาเริ่มต้น (หน้าหลัก) จะถูกเรนเดอร์ผ่าน JavaScript -->
        </main>
    </div>

    <!-- Universal Modal -->
    <div id="universalModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white w-full max-w-xl rounded-xl shadow-2xl border border-slate-200 overflow-hidden">
            <div class="bg-slate-900 text-white px-5 py-3 flex justify-between items-center">
                <h3 id="modalTitle" class="font-bold text-sm">รายละเอียด</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="modalBody" class="p-6 text-sm text-slate-700 space-y-4 max-h-[70vh] overflow-y-auto">
                <!-- Content injected dynamically -->
            </div>
            <div class="bg-slate-50 px-5 py-3 border-t border-slate-200 flex justify-end">
                <button onclick="closeModal()" class="bg-slate-800 hover:bg-slate-900 text-white text-xs px-4 py-2 rounded-lg font-medium">ปิดหน้าต่าง</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Application Core -->
    <script>
        // ข้อมูลตัวอย่างหม้อแปลง
        let transformersData = [
            { id: 'TR-PL-001', name: 'Transformer 115/22 kV', capacity: '50 MVA', location: 'เพลินจิต', hi: 88, status: 'ดี', strategy: 'PdM' },
            { id: 'TR-CL-002', name: 'Transformer 115/22 kV', capacity: '30 MVA', location: 'ชิดลม', hi: 72, status: 'เฝ้าระวัง', strategy: 'PM' },
            { id: 'TR-RM-003', name: 'Transformer 22/0.4 kV', capacity: '10 MVA', location: 'รามอินทรา', hi: 55, status: 'เสื่อมสภาพ', strategy: 'Proactive' },
            { id: 'TR-LD-004', name: 'Transformer 115/22 kV', capacity: '50 MVA', location: 'ลาดพร้าว', hi: 32, status: 'วิกฤต', strategy: 'CM' },
            { id: 'TR-BK-005', name: 'Transformer 22/0.4 kV', capacity: '5 MVA', location: 'บางเขน', hi: 81, status: 'ดี', strategy: 'PM' },
            { id: 'TR-SS-006', name: 'Transformer 115/22 kV', capacity: '40 MVA', location: 'สาทร', hi: 78, status: 'เฝ้าระวัง', strategy: 'PdM' },
            { id: 'TR-ST-007', name: 'Transformer 22/0.4 kV', capacity: '15 MVA', location: 'สีลม', hi: 90, status: 'ดี', strategy: 'PM' }
        ];

        // เริ่มต้นโหลดหน้าแรกเมื่อเปิดเว็บ
        window.onload = function() {
            renderHomeView();
        };

        function switchMenu(menuKey, element) {
            document.querySelectorAll('.menu-item').forEach(el => {
                el.classList.remove('bg-blue-600', 'text-white');
                el.classList.add('hover:bg-slate-800', 'hover:text-white');
            });
            if(element) {
                element.classList.add('bg-blue-600', 'text-white');
                element.classList.remove('hover:bg-slate-800', 'hover:text-white');
            }

            const container = document.getElementById('dynamic-container');
            container.innerHTML = '';

            if (menuKey === 'home') {
                document.getElementById('header-title').innerText = 'RCM & Health Index';
                document.getElementById('header-subtitle').innerText = 'Reliability-Centered Maintenance for Transformer Assets';
                renderHomeView();
            } else if (menuKey === 'machines') {
                document.getElementById('header-title').innerText = 'ข้อมูลเครื่องจักร (Transformer Assets)';
                document.getElementById('header-subtitle').innerText = 'จัดการและตรวจสอบสถานะอุปกรณ์หม้อแปลงไฟฟ้าทั้งหมด';
                renderMachinesView();
            } else if (menuKey === 'rcm') {
                document.getElementById('header-title').innerText = 'RCM Analysis';
                document.getElementById('header-subtitle').innerText = 'วิเคราะห์ความน่าเชื่อถือและกระบวนการ RCM 10 ขั้นตอน';
                renderRCMView();
            } else if (menuKey === 'fmea') {
                document.getElementById('header-title').innerText = 'Failure Mode and Effects Analysis (FMEA)';
                document.getElementById('header-subtitle').innerText = 'วิเคราะห์โหมดความเสียหาย สาเหตุ ผลกระทบ และคำนวณ RPN';
                renderFMEAView();
            } else if (menuKey === 'hi') {
                document.getElementById('header-title').innerText = 'Health Index (HI) Evaluation';
                document.getElementById('header-subtitle').innerText = 'ประเมินสุขภาพหม้อแปลงจากพารามิเตอร์ DGA, Moisture, Oil และอายุการใช้งาน';
                renderHIView();
            } else if (menuKey === 'strategy') {
                document.getElementById('header-title').innerText = 'กลยุทธ์การบำรุงรักษา (Maintenance Strategy)';
                document.getElementById('header-subtitle').innerText = 'เลือกกลยุทธ์ PdM, PM, Redesign หรือ Run-to-Failure';
                renderStrategyView();
            } else if (menuKey === 'maintenance') {
                document.getElementById('header-title').innerText = 'แผนงานบำรุงรักษา (Maintenance Plan & CMMS)';
                document.getElementById('header-subtitle').innerText = 'ตารางปฏิบัติงาน ปฏิทิน PM และการเชื่อมต่อระบบ CMMS';
                renderMaintenanceView();
            } else if (menuKey === 'tracking') {
                document.getElementById('header-title').innerText = 'ติดตามผลและทบทวน (Review & Continuous Improvement)';
                document.getElementById('header-subtitle').innerText = 'ติดตามตัวชี้วัด Breakdown, MTBF, MTTR และ Cost';
                renderTrackingView();
            } else if (menuKey === 'reports') {
                document.getElementById('header-title').innerText = 'รายงานสรุปผล (Reports)';
                document.getElementById('header-subtitle').innerText = 'ส่งออกรายงานข้อมูลสถิติในรูปแบบ Excel / PDF';
                renderReportsView();
            } else if (menuKey === 'settings') {
                document.getElementById('header-title').innerText = 'ตั้งค่าระบบ (Settings)';
                document.getElementById('header-subtitle').innerText = 'จัดการผู้ใช้งาน สิทธิ์การเข้าถึง และพารามิเตอร์ระบบ';
                renderSettingsView();
            }
        }

        // --- View 1: Home Dashboard ---
        function renderHomeView() {
            const container = document.getElementById('dynamic-container');
            container.innerHTML = `
                <!-- Workflow 10 Steps Header -->
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-xs font-bold text-slate-600 uppercase tracking-wider">Workflow : 10 ขั้นตอนการทำ RCM ร่วมกับการประเมิน Health Index</h3>
                        <button onclick="openStepModal(1)" class="text-xs text-blue-600 font-semibold hover:underline">เริ่มใช้งานตามขั้นตอน →</button>
                    </div>
                    <div class="grid grid-cols-10 gap-2 text-center" id="workflow-grid"></div>
                </div>

                <!-- Top Dashboard Cards -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-center mb-3">
                                <h4 class="text-sm font-bold text-slate-700"><i class="fa-solid fa-cubes text-blue-600 mr-2"></i>ภาพรวมสินทรัพย์</h4>
                            </div>
                            <div class="text-3xl font-extrabold text-slate-900 mb-4">128 <span class="text-xs font-normal text-slate-500">เครื่อง</span></div>
                            <div class="space-y-2 text-xs">
                                <div class="flex justify-between items-center p-2 bg-emerald-50 rounded"><span><i class="fa-solid fa-circle text-emerald-500 mr-2"></i>อยู่ในสภาพดี</span><span class="font-bold text-emerald-700">92 เครื่อง</span></div>
                                <div class="flex justify-between items-center p-2 bg-amber-50 rounded"><span><i class="fa-solid fa-triangle-exclamation text-amber-500 mr-2"></i>เฝ้าระวัง</span><span class="font-bold text-amber-700">24 เครื่อง</span></div>
                                <div class="flex justify-between items-center p-2 bg-rose-50 rounded"><span><i class="fa-solid fa-circle-exclamation text-rose-500 mr-2"></i>สภาพวิกฤต</span><span class="font-bold text-rose-700">12 เครื่อง</span></div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-center mb-3">
                                <h4 class="text-sm font-bold text-slate-700"><i class="fa-solid fa-heart-pulse text-rose-500 mr-2"></i>Health Index ภาพรวม</h4>
                                <button onclick="openHIReport()" class="text-xs text-blue-600 hover:underline">รายละเอียด →</button>
                            </div>
                            <div class="flex items-center justify-around my-2">
                                <div class="text-center">
                                    <div class="text-3xl font-extrabold text-emerald-600">78.5</div>
                                    <div class="text-[11px] text-slate-500 font-medium">HI เฉลี่ย (Good)</div>
                                </div>
                                <div class="text-xs space-y-1 text-slate-600 border-l pl-4">
                                    <p><span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 mr-1"></span> 80-100 ดี : <b>92</b></p>
                                    <p><span class="inline-block w-2.5 h-2.5 rounded-full bg-sky-400 mr-1"></span> 60-79 เฝ้าระวัง : <b>24</b></p>
                                    <p><span class="inline-block w-2.5 h-2.5 rounded-full bg-amber-400 mr-1"></span> 40-59 เสื่อม : <b>8</b></p>
                                    <p><span class="inline-block w-2.5 h-2.5 rounded-full bg-rose-500 mr-1"></span> 0-39 วิกฤต : <b>4</b></p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-center mb-3">
                                <h4 class="text-sm font-bold text-slate-700"><i class="fa-solid fa-screwdriver-wrench text-indigo-600 mr-2"></i>กลยุทธ์บำรุงรักษา</h4>
                            </div>
                            <div class="grid grid-cols-2 gap-2 text-xs">
                                <div class="p-3 bg-cyan-50 rounded-lg border border-cyan-200"><p class="text-cyan-800 font-bold">Predictive (PdM)</p><p class="text-lg font-extrabold text-cyan-900 mt-1">45 เครื่อง</p></div>
                                <div class="p-3 bg-blue-50 rounded-lg border border-blue-200"><p class="text-blue-800 font-bold">Preventive (PM)</p><p class="text-lg font-extrabold text-blue-900 mt-1">52 เครื่อง</p></div>
                                <div class="p-3 bg-rose-50 rounded-lg border border-rose-200"><p class="text-rose-800 font-bold">Redesign/Proactive</p><p class="text-lg font-extrabold text-rose-900 mt-1">18 เครื่อง</p></div>
                                <div class="p-3 bg-slate-100 rounded-lg border border-slate-300"><p class="text-slate-700 font-bold">Run-to-Failure</p><p class="text-lg font-extrabold text-slate-900 mt-1">13 เครื่อง</p></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Table Section -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                        <div class="flex items-center space-x-3">
                            <h3 class="font-bold text-slate-800 text-sm"><i class="fa-solid fa-table-cells mr-2 text-blue-600"></i>รายการหม้อแปลง</h3>
                        </div>
                        <button onclick="openAddModal()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs px-3 py-1.5 rounded-lg font-medium transition flex items-center space-x-1">
                            <i class="fa-solid fa-plus"></i><span>เพิ่มรายการ</span>
                        </button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm" id="transformerTable">
                            <thead class="bg-slate-100 text-slate-600 uppercase text-[11px] font-bold">
                                <tr>
                                    <th class="p-3">รหัสทรัพย์สิน</th>
                                    <th class="p-3">ชื่ออุปกรณ์</th>
                                    <th class="p-3">ขนาด (MVA)</th>
                                    <th class="p-3">สถานที่</th>
                                    <th class="p-3">Health Index</th>
                                    <th class="p-3">สถานะ</th>
                                    <th class="p-3">กลยุทธ์</th>
                                    <th class="p-3 text-center">จัดการ</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-200 text-xs" id="table-body"></tbody>
                        </table>
                    </div>
                </div>
            `;
            renderWorkflowSteps();
            renderTableRows();
        }

        function renderWorkflowSteps() {
            const grid = document.getElementById('workflow-grid');
            if(!grid) return;
            const steps = [
                {no: 1, name: 'กำหนดขอบเขต', color: 'blue'},
                {no: 2, name: 'กำหนดหน้าที่', color: 'emerald'},
                {no: 3, name: 'Functional Failure', color: 'amber'},
                {no: 4, name: 'วิเคราะห์ FMEA', color: 'purple'},
                {no: 5, name: 'ประเมิน Consequence', color: 'rose'},
                {no: 6, name: 'Health Index', color: 'cyan'},
                {no: 7, name: 'เลือกกลยุทธ์', color: 'indigo'},
                {no: 8, name: 'Maintenance Task', color: 'teal'},
                {no: 9, name: 'Maintenance Plan', color: 'sky'},
                {no: 10, name: 'ติดตามและทบทวน', color: 'violet'}
            ];
            grid.innerHTML = steps.map(s => `
                <div onclick="openStepModal(${s.no})" class="p-2 bg-${s.color}-50 hover:bg-${s.color}-100 border border-${s.color}-200 rounded-lg cursor-pointer transition">
                    <span class="w-6 h-6 mx-auto bg-${s.color}-600 text-white rounded-full flex items-center justify-center text-xs font-bold mb-1">${s.no}</span>
                    <p class="text-[10px] font-semibold text-${s.color}-900 leading-tight">${s.name}</p>
                </div>
            `).join('');
        }

        function renderTableRows() {
            const tbody = document.getElementById('table-body');
            if(!tbody) return;
            tbody.innerHTML = transformersData.map(item => `
                <tr class="hover:bg-slate-50 transition">
                    <td class="p-3 font-semibold text-blue-600">${item.id}</td>
                    <td class="p-3">${item.name}</td>
                    <td class="p-3">${item.capacity}</td>
                    <td class="p-3">${item.location}</td>
                    <td class="p-3 font-bold ${item.hi >= 80 ? 'text-emerald-600' : item.hi >= 60 ? 'text-sky-600' : item.hi >= 40 ? 'text-amber-600' : 'text-rose-600'}">${item.hi}</td>
                    <td class="p-3"><span class="px-2 py-0.5 rounded font-medium ${item.status==='ดี'?'bg-emerald-100 text-emerald-800':item.status==='เฝ้าระวัง'?'bg-sky-100 text-sky-800':item.status==='เสื่อมสภาพ'?'bg-amber-100 text-amber-800':'bg-rose-100 text-rose-800'}">${item.status}</span></td>
                    <td class="p-3"><span class="px-2 py-0.5 bg-indigo-100 text-indigo-800 rounded font-medium">${item.strategy}</span></td>

        function filterTable(keyword) {
            const rows = document.querySelectorAll('#table-body tr');
            rows.forEach(row => {
                row.style.display = row.innerText.toLowerCase().includes(keyword.toLowerCase()) ? '' : 'none';
            });
        }

        function closeModal() {
            document.getElementById('universalModal').classList.remove('flex');
            document.getElementById('universalModal').classList.add('hidden');
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = "fixed bottom-5 right-5 bg-slate-900 text-white text-xs px-4 py-2.5 rounded-lg shadow-xl z-50";
            toast.innerText = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
