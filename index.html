<style>
:root{
  --navy:#37453f; --navy-2:#415249; --navy-3:#4f6157;
  --accent:#ed9145; --accent-2:#2f7dd1;
  --green:#1fa571; --green-bg:#e5f5ee;
  --amber:#eba020; --amber-bg:#fcf1dc;
  --red:#e0473d; --red-bg:#fbe8e6;
  --blue-bg:#e8f0fb;
  --bg:#f7f4ee; --card:#ffffff; --border:#e6e0d4; --text:#211e1a; --muted:#5c554a;
  --radius:12px;
  font-family:'Inter','Noto Sans Thai',system-ui,sans-serif;
}
*{box-sizing:border-box; min-width:0;}
html,body{height:100%; overflow-x:hidden; max-width:100%;}
body{margin:0; background:var(--bg); color:var(--text); padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); -webkit-font-smoothing:antialiased;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
a{color:inherit;}
button{font-family:inherit;}
.app{display:flex; min-height:100vh;}
.sidebar{width:236px; flex:0 0 236px; background:var(--navy); color:#eceae4; display:flex; flex-direction:column; position:sticky; top:0; height:100vh; padding-top:env(safe-area-inset-top,0px); z-index:40;}
.brand{display:flex; align-items:center; gap:10px; padding:22px 20px 18px; border-bottom:1px solid rgba(255,255,255,.08);}
.brand-mark{width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex:0 0 40px;background:#fff;border-radius:10px;padding:3px;}
.brand-mark img{width:100%;height:100%;object-fit:contain;display:block;}
.brand-text .name{font-weight:800; font-size:15px; letter-spacing:.2px; color:#fff;}
.brand-text .sub{font-size:11px; color:#b9c2bd; margin-top:1px;}
nav.navlist{padding:14px 10px; flex:1; overflow-y:auto;}
.navitem{display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:9px; font-size:13.5px; font-weight:500; color:#c9d0cb; cursor:pointer; margin-bottom:2px; border-left:3px solid transparent; user-select:none;}
.navitem svg{width:17px;height:17px; flex:0 0 17px; opacity:.9;}
.navitem:hover{background:rgba(255,255,255,.05); color:#fff;}
.navitem.active{background:var(--navy-3); color:#fff; border-left:3px solid var(--accent);}
.sidebar-footer{padding:16px 20px 22px; border-top:1px solid rgba(255,255,255,.08); font-size:11px; color:#aab0ac; line-height:1.5;}
.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{position:sticky; top:0; z-index:30; background:var(--card); border-bottom:1px solid var(--border); padding:14px 26px; padding-top:calc(14px + env(safe-area-inset-top,0px)); display:flex; align-items:center; gap:16px; justify-content:space-between; flex-wrap:wrap;}
.page-title h1{margin:0; font-size:19px; font-weight:800;}
.page-title p{margin:1px 0 0; font-size:12px; color:var(--muted); font-weight:500;}
.topbar-right{display:flex; align-items:center; gap:12px;}
.search-box{display:flex; align-items:center; gap:8px; background:var(--bg); border:1px solid var(--border); border-radius:9px; padding:8px 12px; min-width:220px; color:var(--muted); font-size:13px;}
.search-box input{border:none;background:transparent;outline:none;color:var(--text);font-size:13px;width:100%;font-family:inherit;}
.search-box svg{width:15px;height:15px; flex:0 0 15px;}
.langtoggle{display:flex; border:1px solid var(--border); border-radius:9px; overflow:hidden;}
.langtoggle button{border:none; background:var(--bg); color:var(--muted); font-size:12px; font-weight:700; padding:8px 12px; cursor:pointer;}
.langtoggle button.active{background:var(--accent-2); color:#fff;}
.bell{position:relative; width:34px;height:34px;border-radius:9px;background:var(--bg);display:flex;align-items:center;justify-content:center;border:1px solid var(--border); cursor:pointer;}
.bell svg{width:16px;height:16px;color:var(--muted);}
.bell .dot{position:absolute; top:-4px; right:-4px; background:var(--red); color:#fff; font-size:9px; font-weight:700; width:16px;height:16px;border-radius:50%; display:flex;align-items:center;justify-content:center;}
.dropdown{position:absolute; top:44px; right:0; width:min(300px, calc(100vw - 28px)); background:var(--card); border:1px solid var(--border); border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.15); z-index:60; overflow:hidden;}
.dropdown-head{padding:12px 14px; border-bottom:1px solid var(--border); font-weight:800; font-size:13px; display:flex; justify-content:space-between; align-items:center;}
.dropdown-body{max-height:320px; overflow-y:auto;}
.dropdown-item{padding:11px 14px; border-bottom:1px solid var(--border); font-size:12.3px; cursor:pointer;}
.dropdown-item:hover{background:var(--bg);}
.dropdown-item:last-child{border-bottom:none;}
.dropdown-item .dt{color:var(--muted); font-size:10.5px; margin-top:2px;}
.user{display:flex; align-items:center; gap:9px;}
.avatar{width:34px;height:34px;border-radius:50%; background:var(--navy-3); color:#fff; display:flex;align-items:center;justify-content:center; font-weight:700; font-size:13px; flex:0 0 34px;}
.user .u-name{font-size:13px; font-weight:700;}
.user .u-role{font-size:11px; color:var(--muted);}
.content{padding:22px 26px 60px; max-width:1500px; width:100%; margin:0 auto;}
.hidden{display:none !important;}
.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px 18px;}
.card h3{margin:0 0 4px; font-size:14.5px; font-weight:700;}
.card .card-sub{font-size:11.5px; color:var(--muted); margin:0 0 12px;}
.card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:10px; flex-wrap:wrap;}
.card-head h3{margin:0;}
.linklike{font-size:12px; color:var(--accent-2); font-weight:600; cursor:pointer; white-space:nowrap; background:none; border:none;}
.grid{display:grid; gap:16px;}
.g4{grid-template-columns:repeat(4,1fr);}
.g3{grid-template-columns:repeat(3,1fr);}
.g2{grid-template-columns:repeat(2,1fr);}
@media (max-width:1180px){
  .g4{grid-template-columns:repeat(2,1fr);}
  .g3{grid-template-columns:repeat(2,1fr);}
  [style*="grid-template-columns:1.3fr 1fr 1fr"], [style*="grid-template-columns:1.2fr 1fr 1fr"], [style*="grid-template-columns:2fr 1fr"], [style*="grid-template-columns:1.6fr 1fr"], [style*="grid-template-columns:1.7fr 1fr"], [style*="grid-template-columns:1.4fr 1fr"], [style*="grid-template-columns:2.1fr 1fr"], [style*="grid-template-columns:1fr 1.4fr 1fr"], [style*="grid-template-columns:1fr 1.2fr"]{
    grid-template-columns:1fr 1fr !important;
  }
}
@media (max-width:960px){
  .sidebar{position:fixed; top:0; left:0; z-index:60; transform:translateX(-100%); transition:transform .22s ease; box-shadow:0 0 40px rgba(0,0,0,.35);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-backdrop{display:none; position:fixed; inset:0; background:rgba(8,14,28,.5); z-index:55;}
  .sidebar-backdrop.show{display:block;}
  .menu-btn{display:flex !important;}
}
@media (max-width:720px){
  .g4,.g3,.g2{grid-template-columns:1fr !important;}
  [style*="grid-template-columns:"]{grid-template-columns:1fr !important;}
  .kpi-row{margin-left:0; width:100%;}
  .kpi{flex:1 1 45%; min-width:0;}
  .content{padding:14px;}
  .topbar{padding:10px 14px; gap:8px; flex-wrap:wrap;}
  .topbar-right{flex-wrap:wrap; gap:8px;}
  .page-title h1{font-size:16px;}
  .page-title p{display:none;}
  .search-box{order:5; flex:1 1 100%; min-width:0;}
  .langtoggle button{padding:7px 9px; font-size:11px;}
  .user .u-role{display:none;}
  .detail-head{flex-direction:column; align-items:flex-start;}
  .detail-head img{display:none;}
  .thumb-grid{grid-template-columns:repeat(2,1fr);}
  table{font-size:11.5px;}
  th,td{padding:8px 6px;}
  .card{padding:14px;}
  .strategy-steps{flex-wrap:wrap;}
  .strategy-step{min-width:100px;}
  .modal{max-width:100%;}
  .dbranch{gap:24px;}
}
@media (max-width:420px){
  .kpi{flex:1 1 100%;}
  .stat{flex-direction:row;}
  .btn{padding:9px 12px; font-size:12px;}
}
.menu-btn{display:none; width:34px;height:34px;border-radius:9px;background:var(--bg);align-items:center;justify-content:center;border:1px solid var(--border); cursor:pointer;}
.stat{display:flex; align-items:center; gap:12px;}
.stat .icon{width:44px;height:44px;border-radius:10px; display:flex; align-items:center; justify-content:center; flex:0 0 44px;}
.stat .icon svg{width:22px;height:22px;}
.stat .label{font-size:12px; color:var(--muted); font-weight:600;}
.stat .value{font-size:24px; font-weight:800; margin-top:1px;}
.stat .delta{font-size:11px; font-weight:700; margin-top:2px;}
.up{color:var(--green);} .down{color:var(--red);}
.ic-blue{background:var(--blue-bg); color:var(--accent-2);}
.ic-green{background:var(--green-bg); color:var(--green);}
.ic-amber{background:var(--amber-bg); color:var(--amber);}
.ic-red{background:var(--red-bg); color:var(--red);}
table{width:100%; border-collapse:collapse; font-size:12.6px;}
th{text-align:left; padding:9px 10px; color:var(--muted); font-weight:700; border-bottom:1px solid var(--border); white-space:nowrap; font-size:11.5px; text-transform:uppercase; letter-spacing:.3px;}
td{padding:10px 10px; border-bottom:1px solid var(--border); white-space:nowrap;}
tr:last-child td{border-bottom:none;}
.tbl-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch; overscroll-behavior-x:contain;}
.pill{display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700;}
.pill-healthy{background:var(--green-bg); color:var(--green);}
.pill-warning{background:var(--amber-bg); color:var(--amber);}
.pill-critical{background:var(--red-bg); color:var(--red);}
.pill-info{background:var(--blue-bg); color:var(--accent-2);}
.pill-open{background:var(--red-bg); color:var(--red);}
.pill-progress{background:var(--blue-bg); color:var(--accent-2);}
.pill-closed{background:var(--green-bg); color:var(--green);}
.pill.selectable{cursor:pointer; border:1px solid transparent;}
.pill.selectable.on{border-color:currentColor;}
.viewlink{color:var(--accent-2); font-weight:700; cursor:pointer; font-size:12.5px; background:none; border:none; font-family:inherit;}
.btn{border:none; border-radius:8px; padding:9px 15px; font-size:12.5px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; gap:7px; font-family:inherit;}
.btn svg{width:14px;height:14px;}
.btn-primary{background:var(--accent-2); color:#fff;}
.btn-primary:hover{filter:brightness(1.08);}
.btn-ghost{background:var(--card); color:var(--text); border:1px solid var(--border);}
.btn-ghost:hover{background:var(--bg);}
.btn-outline{background:transparent; border:1px solid var(--border); color:var(--text);}
.btn-outline:hover{background:var(--bg);}
.btn-outline.active, .btn-ghost.active{background:var(--accent-2); color:#fff; border-color:var(--accent-2);}
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--border); overflow-x:auto; margin-bottom:18px;}
.tab{padding:11px 15px; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; background:none; border-top:none; border-left:none; border-right:none; font-family:inherit;}
.tab.active{color:var(--accent-2); border-bottom-color:var(--accent-2);}
.chip-input{border:1px solid var(--border); background:var(--bg); border-radius:8px; padding:8px 12px; font-size:12.5px; color:var(--text); font-family:inherit;}
select.chip-input{cursor:pointer;}
.filter-row{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.detail-head{display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin-bottom:16px;}
.detail-head img{width:74px;height:74px;object-fit:cover;border-radius:10px; border:1px solid var(--border); background:#e6e2d6;}
.detail-title{display:flex; align-items:center; gap:10px;}
.detail-title h2{margin:0; font-size:21px; font-weight:800;}
.detail-loc{font-size:12.5px; color:var(--muted); display:flex; align-items:center; gap:5px; margin-top:3px;}
.kpi-row{display:flex; gap:12px; margin-left:auto; flex-wrap:wrap;}
.kpi{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:8px 14px; display:flex; align-items:center; gap:9px; min-width:118px;}
.kpi .kicon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:0 0 30px;}
.kpi .kicon svg{width:15px;height:15px;}
.kpi .klabel{font-size:10.5px; color:var(--muted); font-weight:700;}
.kpi .kvalue{font-size:15px; font-weight:800;}
.chart-box{position:relative; width:100%;}
.gauge-wrap{display:flex; flex-direction:column; align-items:center; padding:6px 0 0; position:relative;}
.gauge-num{font-size:34px; font-weight:800; margin-top:-46px;}
.gauge-sub{font-size:11px; color:var(--muted); font-weight:600;}
.badge-lg{margin-top:8px; padding:5px 18px; border-radius:20px; font-weight:800; font-size:13px;}
.hlist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:9px;}
.hlist li{display:flex; justify-content:space-between; gap:10px; font-size:12.8px; padding-bottom:9px; border-bottom:1px solid var(--border);}
.hlist li:last-child{border-bottom:none; padding-bottom:0;}
.hlist .k{color:var(--muted); font-weight:600;}
.hlist .v{font-weight:700; text-align:right;}
.bar-row{display:flex; align-items:center; gap:10px; margin-bottom:11px;}
.bar-row:last-child{margin-bottom:0;}
.bar-label{font-size:12px; font-weight:700; width:110px; flex:0 0 110px; display:flex; align-items:center; gap:6px;}
.bar-track{flex:1; height:8px; background:var(--bg); border-radius:6px; overflow:hidden;}
.bar-fill{height:100%; border-radius:6px;}
.bar-val{width:30px; text-align:right; font-size:12px; font-weight:800;}
.notebox{background:var(--blue-bg); border-radius:10px; padding:12px 14px; font-size:12px; color:var(--text); display:flex; gap:10px; align-items:flex-start;}
.notebox svg{width:16px;height:16px;flex:0 0 16px; color:var(--accent-2); margin-top:1px;}
.thumb-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
.thumb{border-radius:10px; overflow:hidden; border:1px solid var(--border);}
.thumb img{width:100%; height:64px; object-fit:cover; display:block;}
.thumb .cap{font-size:10.5px; padding:5px 7px; color:var(--muted);}
.recact{list-style:none; margin:0; padding:0;}
.recact li{display:flex; gap:10px; align-items:flex-start; font-size:12.3px; padding:9px 0; border-bottom:1px solid var(--border);}
.recact li:last-child{border-bottom:none;}
.recact .dot{width:8px;height:8px;border-radius:50%; margin-top:4px; flex:0 0 8px;}
.recact .rt{color:var(--muted); font-size:11px;}
.donut-wrap{position:relative; display:flex; align-items:center; justify-content:center;}
.donut-center{position:absolute; text-align:center; pointer-events:none;}
.donut-center .n{font-size:22px; font-weight:800;}
.donut-center .l{font-size:10.5px; color:var(--muted); font-weight:600;}
.legend{display:flex; flex-direction:column; gap:8px; font-size:12px;}
.legend .li{display:flex; align-items:center; gap:8px;}
.legend .sw{width:9px;height:9px;border-radius:3px;flex:0 0 9px;}
.legend .lval{margin-left:auto; font-weight:700;}
.mapbox{position:relative; border-radius:10px; overflow:hidden; height:150px; background:linear-gradient(135deg,#eaeee3,#dbe2d2);}
.mapbox svg{width:100%;height:100%;}
.map-pin{position:absolute; top:38%; left:52%; transform:translate(-50%,-100%); text-align:center;}
.map-pin .pinhead{background:var(--red); color:#fff; border-radius:8px; padding:4px 8px; font-size:10.5px; font-weight:700; white-space:nowrap; box-shadow:0 3px 8px rgba(0,0,0,.2);}
.map-pin svg{width:20px;height:20px; color:var(--red); margin-top:-1px;}
.strategy-steps{display:flex; gap:8px; overflow-x:auto; margin-bottom:18px;}
.strategy-step{flex:1; min-width:130px; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px; text-align:center; position:relative;}
.strategy-step .stitle{font-weight:800; font-size:13px;}
.strategy-step .ssub{font-size:11px; color:var(--muted); margin-top:3px;}
.strategy-arrow{display:flex; align-items:center; color:var(--muted);}
.dtree{display:flex; flex-direction:column; align-items:center; gap:10px;}
.dnode{padding:10px 16px; border-radius:9px; font-size:12.5px; font-weight:700; text-align:center; max-width:280px;}
.dnode.q{background:var(--navy); color:#fff;}
.dnode.yes{background:var(--red-bg); color:var(--red); font-size:12px;}
.dnode.no{background:var(--green-bg); color:var(--green); font-size:12px;}
.dnode.result{padding:14px 20px; font-size:14px;}
.dbranch{display:flex; gap:60px; justify-content:center; width:100%; flex-wrap:wrap;}
.dcol{display:flex; flex-direction:column; align-items:center; gap:8px;}
.dline{width:1px; height:14px; background:var(--border);}
.timeline-row{display:grid; grid-template-columns:130px 1fr; align-items:center; gap:10px; margin-bottom:8px; font-size:11.5px;}
.timeline-track{position:relative; height:18px; background:var(--bg); border-radius:5px; overflow:hidden;}
.timeline-bar{position:absolute; top:2px; height:14px; border-radius:4px;}
.today-line{position:absolute; top:0; bottom:0; width:2px; background:var(--red);}
.small-muted{font-size:11px; color:var(--muted);}
.toggle{position:relative; width:38px; height:21px; border-radius:20px; background:var(--border); cursor:pointer; flex:0 0 38px;}
.toggle.on{background:var(--green);}
.toggle .knob{position:absolute; top:2px; left:2px; width:17px;height:17px;border-radius:50%; background:#fff; transition:left .15s;}
.toggle.on .knob{left:19px;}
.settingsrow{display:flex; justify-content:space-between; align-items:center; padding:9px 0; border-bottom:1px solid var(--border); font-size:12.5px; gap:10px;}
.settingsrow:last-child{border-bottom:none;}
.settingsrow .srlabel{display:flex; align-items:center; gap:9px; font-weight:600;}
.settingsrow .srlabel svg{width:15px;height:15px; color:var(--muted);}
::-webkit-scrollbar{height:7px; width:7px;}
::-webkit-scrollbar-thumb{background:#d6d2c4; border-radius:10px;}
.duval-svg{width:100%; max-width:280px; margin:0 auto; display:block;}
.modal-overlay{position:fixed; inset:0; background:rgba(10,15,30,.5); z-index:100; display:flex; align-items:center; justify-content:center; padding:20px;}
.modal{background:var(--card); border-radius:14px; width:100%; max-width:440px; max-height:88vh; overflow-y:auto; padding:20px; box-shadow:0 20px 60px rgba(0,0,0,.3);}
.modal h3{margin:0 0 14px; font-size:16px;}
.formrow{margin-bottom:12px;}
.formrow label{display:block; font-size:11.5px; font-weight:700; color:var(--muted); margin-bottom:5px;}
.formrow input, .formrow select{width:100%; border:1px solid var(--border); background:var(--bg); border-radius:8px; padding:9px 11px; font-size:13px; color:var(--text); font-family:inherit;}
.modal-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:16px;}
.toast-wrap{position:fixed; top:16px; right:16px; z-index:200; display:flex; flex-direction:column; gap:8px; padding-top:env(safe-area-inset-top,0px);}
.toast{background:var(--navy); color:#fff; padding:11px 16px; border-radius:9px; font-size:12.5px; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,.25); display:flex; align-items:center; gap:8px; animation:toastin .18s ease;}
.toast.success{background:#1f8a5c;}
.toast.error{background:#c0392b;}
@keyframes toastin{from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);}}
@media print{
  .sidebar, .topbar, .toast-wrap, .modal-overlay, .menu-btn, .tabs, .btn, .viewlink, .linklike{ display:none !important; }
  body, .content{ background:#fff !important; color:#000 !important; padding:0 !important; }
  .card{ border:1px solid #ccc !important; break-inside:avoid; box-shadow:none !important; }
  .main{ display:block !important; }
}
.login-overlay{position:fixed; inset:0; background:linear-gradient(120deg,#37453f,#6b7d73); z-index:500; display:flex; align-items:center; justify-content:center; padding:20px;}
.login-card{background:var(--card); border-radius:16px; padding:32px 28px; width:100%; max-width:380px; box-shadow:0 20px 60px rgba(0,0,0,.35);}
.login-card h2{margin:0 0 4px; font-size:20px;}
.login-card p{margin:0 0 20px; font-size:12.5px; color:var(--muted);}
.login-card .formrow input{width:100%;}
.login-hint{margin-top:14px; font-size:11px; color:var(--muted); text-align:center;}
</style>

function trendForAsset(asset){

  const startOffset = cat==='healthy' ? (seededFrac(seed,1)*6-2) : cat==='warning' ? (10+seededFrac(seed,1)*10) : (32+seededFrac(seed,1)*16);
  const start = Math.min(98, end+startOffset);
  const vals = [];
  for(let i=0;i<12;i++){ const frac=i/11; const jitter=(seededFrac(seed,i+3)-0.5)*3; vals.push(Math.max(0,Math.min(100,Math.round(start+(end-start)*frac+jitter)))); }

}

function genMaintForAsset(asset){
  const cat = categoryFor(asset); const seed = assetSeed(asset.id);
  let no=1; const tasks=[];
  MAINT_TEMPLATE.forEach((tpl,i)=>{
    const offset = tpl.offset[cat]; if(offset===null) return;
    const monthIdx = Math.min(GANTT_MONTHS.length-1, 2+offset);
    const day = 5 + Math.floor(seededFrac(seed,i)*12);
    const dur = tpl.dur[cat];
    const endDay = day + dur - 1;
    const mLabel = GANTT_MONTHS[monthIdx];
    const start = `${day} ${mLabel} 2026`;
    const end = `${endDay} ${mLabel} 2026`;
    const durStr = dur+' '+(state.lang==='th'?'วัน':(dur>1?'days':'day'));
    tasks.push({no:no++, task:tpl.task, type:tpl.type, start, end, dur:durStr, m:mLabel, len: dur<=1?1:dur<=4?2:3});
  });
  return tasks;
}

function toast(msg, kind){

function downloadFile(filename, content, mime){
  const blob = new Blob([content], {type: mime || 'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');

  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

function destroyCharts(){ Object.values(chartRegistry).forEach(c=>{ try{ c && c.destroy(); }catch(e){} }); chartRegistry={}; }
function mkChart(id,cfg){
  const el=document.getElementById(id); if(!el) return;
  try{
    if(typeof Chart === 'undefined'){ el.parentElement.innerHTML = '<div class="small-muted" style="padding:20px;text-align:center;">Chart library failed to load.</div>'; return; }
    chartRegistry[id]=new Chart(el.getContext('2d'), cfg);

}
function cssv(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#8b9099'; }
const valueLabelPlugin = {
  id: 'valueLabels',
  afterDatasetsDraw(chart){
    const {ctx} = chart;
    chart.data.datasets.forEach((ds, dsIndex)=>{
      const meta = chart.getDatasetMeta(dsIndex);
      if(meta.hidden || !meta.data) return;
      meta.data.forEach((point, index)=>{
        const value = ds.data[index];
        if(value===undefined || value===null) return;
        ctx.save();
        ctx.fillStyle = ds.borderColor || '#3a362f';
        ctx.font = '700 11px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(String(value), point.x, point.y - 10);
        ctx.restore();
      });
    });
  }
};

function openAddDgaResultModal(){
  const gasNames = ['H2','CH4','C2H6','C2H4','C2H2','CO','CO2'];
  const ranges = {H2:'< 100',CH4:'< 60',C2H6:'< 50',C2H4:'< 100',C2H2:'< 5',CO:'< 350',CO2:'< 1000'};
  openModal(t('modal_add_dga'), `
    <div class="formrow"><label>${t('field_date')}</label><input name="date" placeholder="e.g. 20 Sep 2026" required></div>
    ${gasNames.map(g=>`<div class="formrow"><label>${g} (ppm)</label><input name="${g}" type="number" min="0" value="0" required></div>`).join('')}
  `, (data)=>{
    const gases = gasNames.map(g=>{
      const v = Number(data[g]);
      const limit = parseInt(ranges[g].replace(/[^0-9]/g,''),10);
      return {g, v, range: ranges[g], status: v>limit? 'up' : 'ok'};
    });
    const tdcg = gases.reduce((s,g)=>s+g.v,0);
    gases.push({g:'TDCG', v:tdcg, range:'-', status: tdcg>500?'warn':'ok'});
    DGA_SAMPLES.unshift({date:data.date, gases});
    state.dgaSampleIdx = 0;
    render(); toast(t('toast_added'),'success');
  });
}

function getRcmAnswers(modeKey){ if(!state.rcmAnswers[modeKey]) state.rcmAnswers[modeKey] = {}; return state.rcmAnswers[modeKey]; }
function computeRcmResult(ans){
  if(ans.q1==='yes') return 'BM';
  if(ans.q1==='no'){
    if(ans.q2==='yes'){ if(ans.q3==='yes') return 'PdM'; if(ans.q3==='no') return 'PM'; }
    else if(ans.q2==='no'){ if(ans.q4==='yes') return 'PM'; if(ans.q4==='no') return 'CM'; }
  }
  return null;
}
const RCM_RESULT_STYLE = {BM:['var(--red-bg)','var(--red)'],CM:['var(--amber-bg)','var(--amber)'],PM:['var(--blue-bg)','var(--accent-2)'],PdM:['#efe8fa','#6f3fc0']};
function renderRcmTree(modeKey){
  const ans = getRcmAnswers(modeKey);
  const qBtn = (q,val,label)=>`<button class="dnode ${val==='yes'?'yes':'no'}" data-rcm-q="${q}" data-rcm-ans="${val}" style="cursor:pointer;border:none;font-family:inherit;">${label}</button>`;
  const answeredLine = (q)=>`<div class="small-muted" style="text-align:center;">${t(q)} → <b>${ans[q]==='yes'?t('yes'):t('no')}</b> <button class="linklike" data-rcm-undo="${q}" style="margin-left:4px;">↺ ${t('change')}</button></div>`;
  let html = `<div class="dnode q">${t('q1')}</div>`;
  if(!ans.q1){ html += `<div class="dbranch"><div class="dcol">${qBtn('q1','yes',t('yes'))}</div><div class="dcol">${qBtn('q1','no',t('no'))}</div></div>`; return html; }
  html += answeredLine('q1');
  if(ans.q1==='yes'){ html += `<div class="dnode result" style="background:var(--red-bg);color:var(--red);">${t('safety_critical')}</div>`; return html; }
  html += `<div class="dnode q">${t('q2')}</div>`;
  if(!ans.q2){ html += `<div class="dbranch"><div class="dcol">${qBtn('q2','yes',t('yes'))}</div><div class="dcol">${qBtn('q2','no',t('no'))}</div></div>`; return html; }
  html += answeredLine('q2');
  const qNext = ans.q2==='yes' ? 'q3' : 'q4';
  html += `<div class="dnode q">${t(qNext)}</div>`;
  if(!ans[qNext]){ html += `<div class="dbranch"><div class="dcol">${qBtn(qNext,'yes',t('yes'))}</div><div class="dcol">${qBtn(qNext,'no',t('no'))}</div></div>`; return html; }
  html += answeredLine(qNext);
  const result = computeRcmResult(ans);
  const [bg,fg] = RCM_RESULT_STYLE[result];
  html += `<div class="dnode result" style="background:${bg};color:${fg};">${result}</div>`;
  return html;
}

  document.querySelectorAll('[data-plan-view]').forEach(el=> el.addEventListener('click',()=>{ state.planView = el.dataset.planView; render(); }));
  const exportBtn = document.getElementById('btnExportReport');
  if(exportBtn) exportBtn.addEventListener('click', ()=>{
    const a = ASSETS.find(x=>x.id===state.assetId);
    openExportChoiceModal(()=>{ const rows = [['Asset ID','Location','Health Index','Status','RPN','DGA Diagnosis'],[a.id,a.loc,a.hi,a.status,'280','D2']]; downloadFile(`${a.id}_report.csv`, toCSV(rows), 'text/csv'); toast(t('toast_exported'),'success'); });
  });
  document.querySelectorAll('[data-create-plan]').forEach(el=> el.addEventListener('click',()=>{ state.detailTab='plan'; render(); }));
  document.querySelectorAll('.dl-doc').forEach(el=> el.addEventListener('click',()=>{

  }));
}

      <div class="tbl-wrap"><table><thead><tr><th>${t('level')}</th><th>${t('hi_range')}</th><th>${t('action')}</th></tr></thead><tbody>

      <tr><td><span class="pill" style="background:#e5f5ee;color:#178a5e;">${t('moderate')}</span></td><td>60–79</td><td class="small-muted">${state.lang==='th'?'ติดตามใกล้ชิด':'Close monitoring'}</td></tr>
      <tr><td><span class="pill pill-warning">${state.lang==='th'?'สูง':'High'}</span></td><td>40–59</td><td class="small-muted">${state.lang==='th'?'วางแผนบำรุงรักษา':'Plan maintenance'}</td></tr>
      <tr><td><span class="pill pill-critical">${t('critical')}</span></td><td>20–39</td><td class="small-muted">${state.lang==='th'?'ดำเนินการทันที':'Immediate action'}</td></tr>
      <tr><td><span class="pill" style="background:#fbe8e6;color:#c23a2e;">${t('very_critical')}</span></td><td>0–19</td><td class="small-muted">${state.lang==='th'?'หยุดใช้งานด่วน':'Urgent shutdown'}</td></tr>
      </tbody></table></div>
    </div>
    <div class="card"><h3>${t('note1')}</h3><p class="small-muted">${t('note2')}</p></div>
  </div>`;
  if(state.settingsTab==='fm') return `
  <div class="card"><div class="card-head"><h3>${t('settings_fm')}</h3><button class="linklike" id="btnManageFm">${t('manage')}</button></div>
    <div class="tbl-wrap"><table><thead><tr><th>${t('code')}</th><th>${t('failure_mode')}</th><th>${t('category')}</th></tr></thead><tbody>
    <tr><td>FM-01</td><td>Overheating</td><td>${state.lang==='th'?'ความร้อน':'Thermal'}</td></tr>
    <tr><td>FM-02</td><td>Insulation Failure</td><td>${state.lang==='th'?'ไฟฟ้า':'Electrical'}</td></tr>
    <tr><td>FM-03</td><td>Oil Leakage</td><td>${state.lang==='th'?'กลไก':'Mechanical'}</td></tr>
    <tr><td>FM-04</td><td>Winding Deformation</td><td>${state.lang==='th'?'กลไก':'Mechanical'}</td></tr>
    <tr><td>FM-05</td><td>Tap Changer Fault</td><td>${state.lang==='th'?'กลไก':'Mechanical'}</td></tr>
    <tr><td>FM-06</td><td>Bushing Failure</td><td>${state.lang==='th'?'ไฟฟ้า':'Electrical'}</td></tr>
    </tbody></table></div>
  </div>`;
  if(state.settingsTab==='maint') return `
  <div class="card"><div class="card-head"><h3>${t('maint_strategy_settings')}</h3><button class="btn btn-outline" id="btnEditMaint" style="padding:6px 11px;font-size:12px;">${t('edit')}</button></div>
    <div class="tbl-wrap"><table><thead><tr><th>${t('strategy')}</th><th>${t('trigger')}</th></tr></thead><tbody>
    <tr><td><b>BM</b> ${state.lang==='th'?'ซ่อมเมื่อเสีย':'Breakdown'}</td><td class="small-muted">${state.lang==='th'?'ใช้งานจนเสีย':'Run to failure — when failed'}</td></tr>
    <tr><td><b>CM</b> ${state.lang==='th'?'แก้ไข':'Corrective'}</td><td class="small-muted">${state.lang==='th'?'แก้ไขเมื่อพบความผิดปกติ':'Fix after abnormality found'}</td></tr>
    <tr><td><b>PM</b> ${state.lang==='th'?'ป้องกัน':'Preventive'}</td><td class="small-muted">${state.lang==='th'?'ตามรอบเวลา':'Time-based, by schedule'}</td></tr>
    <tr><td><b>CBM</b> ${state.lang==='th'?'ตามสภาพ':'Condition Based'}</td><td class="small-muted">${state.lang==='th'?'เมื่อถึงเกณฑ์สภาพ':'When condition threshold met'}</td></tr>
    <tr><td><b>PdM</b> ${state.lang==='th'?'คาดการณ์':'Predictive'}</td><td class="small-muted">${state.lang==='th'?'วิเคราะห์แนวโน้มและพยากรณ์':'Trend analysis & forecasting'}</td></tr>
    </tbody></table></div>
  </div>`;
  if(state.settingsTab==='users') return `
  <div class="card"><div class="card-head"><h3>${t('settings_users')}</h3><button class="btn btn-primary" id="btnAddUser" style="padding:6px 12px;font-size:12px;">${t('add_user')}</button></div>
    <div class="tbl-wrap"><table><thead><tr><th>${t('name')}</th><th>${t('role_col')}</th><th>${t('field_email')}</th><th>${t('status')}</th></tr></thead><tbody>
    ${USERS.map(u=>`<tr><td>${u.name}</td><td>${u.role}</td><td class="small-muted">${u.email}</td><td><span class="pill pill-healthy">${trStatus(u.status)}</span></td></tr>`).join('')}
    </tbody></table></div>
  </div>`;
  if(state.settingsTab==='sys') return `
  <div class="grid g2">
    <div class="card"><h3>${t('data_mgmt')}</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-ghost sys-btn" style="flex:1;justify-content:center;" data-sys="import">${t('import_data')}</button>
        <button class="btn btn-ghost sys-btn" style="flex:1;justify-content:center;" data-sys="export">${t('export_data')}</button>
        <button class="btn btn-ghost sys-btn" style="flex:1;justify-content:center;" data-sys="backup">${t('backup_db')}</button>
        <button class="btn btn-ghost sys-btn" style="flex:1;justify-content:center;" data-sys="restore">${t('restore_db')}</button>
      </div>
    </div>
    <div class="card"><h3>${t('appearance')}</h3>
      <div class="settingsrow"><div class="srlabel">${t('theme')}</div><span class="small-muted">${t('light')}</span></div>
      <div class="settingsrow"><div class="srlabel">${t('items_per_page')}</div><select class="chip-input"><option>10</option><option>20</option><option>50</option></select></div>
    </div>
  </div>`;
  // general
  return `
  <div class="grid g3" style="margin-bottom:16px; align-items:stretch;">
    <div class="card"><div class="card-head"><h3>${t('system_info')}</h3><button class="btn btn-outline" id="btnEditSystem" style="padding:6px 11px;font-size:12px;">${t('edit')}</button></div>
      <ul class="hlist"><li><span class="k">${t('system_name')}</span><span class="v">RCM Transformer</span></li><li><span class="k">${t('version')}</span><span class="v">1.0.0</span></li>
      <li><span class="k">${t('department')}</span><span class="v">${state.lang==='th'?'ฝ่ายบริหารสินทรัพย์':'Asset Management Division'}</span></li>
      <li><span class="k">${t('timezone')}</span><span class="v">(UTC+7) Bangkok</span></li><li><span class="k">${t('date_format')}</span><span class="v">DD/MM/YYYY</span></li>
      <li><span class="k">${t('sys_language')}</span><span class="v">${state.lang==='th'?'ไทย (รองรับ EN)':'English (TH Support)'}</span></li></ul>
    </div>
    <div class="card"><h3>${t('notif_settings')}</h3>
      <div class="settingsrow"><div class="srlabel">${badge('notification',22)} ${t('email_notif')}</div><div class="toggle on" data-toggle="1"><div class="knob"></div></div></div>
      <div class="settingsrow"><div class="srlabel">${badge('scheduled',22)} ${t('task_reminder')}</div><div class="toggle on" data-toggle="1"><div class="knob"></div></div></div>
      <div class="settingsrow"><div class="srlabel">${badge('critical',22)} ${t('high_risk_alert')}</div><div class="toggle on" data-toggle="1"><div class="knob"></div></div></div>
      <div class="settingsrow"><div class="srlabel">${badge('reports',22)} ${t('monthly_report')}</div><div class="toggle" data-toggle="1"><div class="knob"></div></div></div>
      <div class="settingsrow"><div class="srlabel">${badge('settings',22)} ${t('sys_update_notif')}</div><div class="toggle on" data-toggle="1"><div class="knob"></div></div></div>
    </div>
    <div class="card"><h3>${t('appearance')}</h3>
      <div class="settingsrow"><div class="srlabel">${t('theme')}</div><span class="small-muted">${t('light')}</span></div>
      <div class="settingsrow"><div class="srlabel">${t('items_per_page')}</div><select class="chip-input"><option>10</option><option>20</option><option>50</option></select></div>
    </div>
  </div>`;
}
function attachSettingsEvents(){
  document.querySelectorAll('[data-stab]').forEach(el=> el.addEventListener('click',()=>{ state.settingsTab = el.dataset.stab; render(); }));
  document.querySelectorAll('.toggle[data-toggle]').forEach(tgl=> tgl.addEventListener('click',()=>{ tgl.classList.toggle('on'); toast(t('toast_saved')); }));
  ['btnEditHi','btnEditRisk','btnEditMaint','btnEditSystem'].forEach(id=>{ const b=document.getElementById(id); if(b) b.addEventListener('click', ()=>toast(t('toast_saved'),'success')); });
  const manageFm = document.getElementById('btnManageFm'); if(manageFm) manageFm.addEventListener('click', ()=>{ state.page='detail'; state.detailTab='fmea'; render(); });
  const addUser = document.getElementById('btnAddUser'); if(addUser) addUser.addEventListener('click', ()=>{
    openModal(t('modal_add_user'), `
      <div class="formrow"><label>${t('field_name')}</label><input name="name" required></div>
      <div class="formrow"><label>${t('field_role')}</label><select name="role"><option>Admin</option><option selected>Operator</option><option>Viewer</option></select></div>
      <div class="formrow"><label>${t('field_email')}</label><input name="email" type="email" required></div>
    `, (data)=>{ USERS.push({name:data.name, role:data.role, email:data.email, status:'Active'}); render(); toast(t('toast_added'),'success'); });
  });
  document.querySelectorAll('.sys-btn').forEach(b=> b.addEventListener('click', ()=>{
    const kind = b.dataset.sys;
    if(kind==='export'){ const rows=[['ID','Location','Health Index','Status'], ...ASSETS.map(a=>[a.id,a.loc,a.hi,a.status])]; downloadFile('rcm_export.csv', toCSV(rows), 'text/csv'); toast(t('toast_exported'),'success'); }
    else if(kind==='backup'){ downloadFile('rcm_backup.json', JSON.stringify({ASSETS,FMEA,MAINT_PLAN,USERS}, null, 2), 'application/json'); toast(t('toast_exported'),'success'); }
    else toast(t('toast_saved'),'success');
  }));
}

/* ============ GLOBAL SEARCH / BELL / LANG ============ */
function attachGlobalViewLinks(){
  document.querySelectorAll('[data-view]').forEach(el=>{
    el.addEventListener('click',()=>{ state.assetId = el.dataset.view; state.page='detail'; state.detailTab='overview'; render(); window.scrollTo(0,0); });
  });
}
function attachTopbarEvents(){
  document.getElementById('langEn').addEventListener('click', ()=>setLang('en'));
  document.getElementById('langTh').addEventListener('click', ()=>setLang('th'));
  const userBtn = document.getElementById('userMenuBtn');
  userBtn.addEventListener('click', (e)=>{ e.stopPropagation(); toggleUserDropdown(); });
  document.addEventListener('click', (e)=>{ const ud=document.getElementById('userDropdown'); if(ud && !ud.contains(e.target) && e.target!==userBtn && !userBtn.contains(e.target)) ud.innerHTML=''; });
  const bell = document.getElementById('bellBtn');
  bell.addEventListener('click', (e)=>{ e.stopPropagation(); toggleBellDropdown(); });
  document.addEventListener('click', (e)=>{ const dd=document.getElementById('bellDropdown'); if(dd && !dd.contains(e.target) && e.target!==bell) dd.innerHTML=''; });
  const gs = document.getElementById('globalSearch');
  gs.value = state.globalSearch;
  gs.addEventListener('keydown', (e)=>{
    if(e.key==='Enter'){
      const q = gs.value.trim().toLowerCase(); state.globalSearch = gs.value;
      const found = ASSETS.find(a=>a.id.toLowerCase()===q) || ASSETS.find(a=>a.id.toLowerCase().includes(q) || a.loc.toLowerCase().includes(q));
      if(found){ state.assetId = found.id; state.page='detail'; state.detailTab='overview'; render(); window.scrollTo(0,0); }
      else toast(t('toast_no_result'));
    }
  });
}
function toggleBellDropdown(){
  const dd = document.getElementById('bellDropdown');
  if(dd.innerHTML){ dd.innerHTML=''; return; }
  dd.innerHTML = `<div class="dropdown"><div class="dropdown-head"><span>${t('notifications')}</span><button class="linklike" id="markAllRead">${t('mark_all_read')}</button></div>
  <div class="dropdown-body">${NOTIFICATIONS.map(n=>`<div class="dropdown-item">${n[state.lang]}<div class="dt">${n.t}</div></div>`).join('')}</div></div>`;
  document.getElementById('markAllRead').addEventListener('click', ()=>{ document.getElementById('bellCount').style.display='none'; dd.innerHTML=''; toast(t('toast_saved')); });
}
function toggleUserDropdown(){
  const dd = document.getElementById('userDropdown');
  if(dd.innerHTML){ dd.innerHTML=''; return; }
  dd.innerHTML = `<div class="dropdown" style="width:200px;"><div class="dropdown-body">
    <div class="dropdown-item" id="logoutBtn" style="color:var(--red); font-weight:700; cursor:pointer;">${icon('x',' style="width:13px;height:13px;display:inline-block;vertical-align:-2px;margin-right:6px;"')}${t('logout')}</div>
  </div></div>`;
  document.getElementById('logoutBtn').addEventListener('click', ()=>{
    dd.innerHTML='';
    try{ sessionStorage.removeItem('rcm_logged_in'); }catch(err){}
    showLogin();
  });
}
function setLang(lang){ state.lang = lang; render(); }

/* ============ ROUTER ============ */
function pageMeta(){
  const titles = {
    overview:[t('nav_overview'), t('sub_overview')],
    assets:[t('nav_assets'), t('sub_assets')],
    detail:[state.assetId, t('sub_detail')],
    reports:[t('nav_reports'), t('sub_reports')],
    settings:[t('nav_settings'), t('sub_settings')],
  };
  return titles[state.page] || ['RCM Transformer',''];
}
function render(){
  renderNav();
  document.getElementById('langEn').classList.toggle('active', state.lang==='en');
  document.getElementById('langTh').classList.toggle('active', state.lang==='th');
  const [ttl,sub] = pageMeta();
  document.getElementById('pageTitle').textContent = ttl;
  document.getElementById('pageSub').textContent = sub;
  const content = document.getElementById('content');
  destroyCharts();
  if(state.page==='overview'){ content.innerHTML = renderOverview(); attachGlobalViewLinks(); attachOverviewEvents(); initOverviewCharts(); }
  else if(state.page==='assets'){ content.innerHTML = renderAssetsPage(); attachGlobalViewLinks(); attachAssetsPageEvents(); }
  else if(state.page==='detail'){ syncAssetData(); content.innerHTML = renderDetail(); attachDetailEvents(); initDetailCharts(currentAsset()); }
  else if(state.page==='reports'){ content.innerHTML = renderReports(); initReportsCharts(); attachReportsEvents(); }
  else if(state.page==='settings'){ content.innerHTML = renderSettings(); attachSettingsEvents(); }
}
function openSidebar(){ document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebarBackdrop').classList.add('show'); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarBackdrop').classList.remove('show'); }
document.getElementById('menuBtn').addEventListener('click',()=>{ const sb=document.getElementById('sidebar'); sb.classList.contains('open') ? closeSidebar() : openSidebar(); });
document.getElementById('sidebarBackdrop').addEventListener('click', closeSidebar);

/* ============ LOGIN GATE ============ */
document.getElementById('loginTitle').textContent = t('login_title');
document.getElementById('loginSub').textContent = t('login_sub');
document.getElementById('loginUserLabel').textContent = t('login_user');
document.getElementById('loginPassLabel').textContent = t('login_pass');
document.getElementById('loginSubmitBtn').textContent = t('login_submit');
document.getElementById('loginHint').textContent = t('login_hint');
function showApp(){
  document.getElementById('loginOverlay').classList.add('hidden');
  document.getElementById('appRoot').style.visibility = 'visible';
  attachTopbarEvents();
  render();
}
function showLogin(){
  document.getElementById('loginOverlay').classList.remove('hidden');
  document.getElementById('appRoot').style.visibility = 'hidden';
}
document.getElementById('loginForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  try{ sessionStorage.setItem('rcm_logged_in','1'); }catch(err){}
  showApp();
});
let alreadyLoggedIn = false;
try{ alreadyLoggedIn = sessionStorage.getItem('rcm_logged_in')==='1'; }catch(err){}
if(alreadyLoggedIn){ showApp(); }
</script>
</body>
</html>
